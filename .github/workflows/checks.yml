name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd)"
      - name: Verify dependencies
        run: go mod verify
      - name: Test with race detection
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        run: go build -o bin/ssh-portfolio ./cmd
      - name: Exercise a real SSH session
        run: python3 scripts/smoke_test.py --binary bin/ssh-portfolio
